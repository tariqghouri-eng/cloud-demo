<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live from Azure</title>
<script>
  // =====================================================
  //  EDIT ONLY THESE 3 LINES DURING THE DEMO
  // =====================================================
  const APP_NAME = "Denning-Bahria";
  const MESSAGE  = "Come to learn Cloud and Devops";
  const VERSION  = "v1";
  // =====================================================
</script>
<style>
  :root {
    --night: #120a2b;
    --violet: #5b2fd6;
    --lilac: #c9b8ff;
    --sky: #8fe3fb;
    --paper: #f6f2ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, #3a1a99 0%, var(--night) 60%);
    color: var(--paper);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: calc(28px + env(safe-area-inset-top, 0px)) 24px calc(28px + env(safe-area-inset-bottom, 0px));
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
    user-select: none;
  }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .name { font-weight: 700; font-size: 1.05rem; color: var(--lilac); }
  .version {
    font-weight: 700; font-size: 0.95rem; color: var(--night);
    background: var(--sky); border-radius: 999px; padding: 6px 14px;
  }
  main { text-align: center; }
  h1 {
    margin: 0 auto;
    max-width: 14ch;
    font-size: clamp(2.6rem, 11vw, 7rem);
    line-height: 1.02;
    font-weight: 800;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .hint { margin-top: 28px; color: var(--lilac); font-size: 1.05rem; }
  footer { text-align: center; color: #a99bd6; font-size: 0.95rem; line-height: 1.5; }
  .pulse { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--sky); margin-right: 8px; vertical-align: middle; animation: beat 1.6s ease-in-out infinite; }
  @keyframes beat { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  canvas { position: fixed; inset: 0; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<header>
  <span class="name" id="appName"></span>
  <span class="version" id="version"></span>
</header>
<main>
  <h1 id="message"></h1>
  <p class="hint">Tap anywhere to celebrate</p>
</main>
<footer>
  <div><span class="pulse"></span>Running live on Microsoft Azure</div>
  <div>Deployed at Denning Institute · CS Community · <span id="loaded"></span></div>
</footer>
<script>
  document.getElementById("appName").textContent = APP_NAME;
  document.getElementById("message").textContent = MESSAGE;
  document.getElementById("version").textContent = VERSION;
  document.title = APP_NAME;
  document.getElementById("loaded").textContent =
    "loaded " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

  // Confetti on tap
  const canvas = document.getElementById("fx");
  const ctx = canvas.getContext("2d");
  const colors = ["#8fe3fb", "#c9b8ff", "#7c4dff", "#ffd27a", "#f6f2ff"];
  let bits = [];
  function size() { canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
  addEventListener("resize", size); size();
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function burst(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 8;
      bits.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 4, r: 4 + Math.random() * 5,
        c: colors[(Math.random() * colors.length) | 0], life: 90 + Math.random() * 40, rot: Math.random() * 6 });
    }
  }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    bits = bits.filter(b => b.life > 0);
    for (const b of bits) {
      b.vy += 0.25; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.life--; b.rot += 0.2;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot); ctx.fillStyle = b.c;
      ctx.fillRect(-b.r, -b.r / 2, b.r * 2, b.r); ctx.restore();
    }
    requestAnimationFrame(tick);
  }
  if (!calm) {
    tick();
    addEventListener("pointerdown", e => burst(e.clientX, e.clientY, 60));
    setTimeout(() => burst(innerWidth / 2, innerHeight / 2, 120), 300);
  }
</script>
</body>
</html>
